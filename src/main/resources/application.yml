spring:
  application:
    name: lineage
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/lineage}
    username: ${SPRING_DATASOURCE_USERNAME:lineage}
    password: ${SPRING_DATASOURCE_PASSWORD:lineage_dev_pass}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration
    clean-disabled: false
 
server:
  port: 8080
  compression:
    enabled: true

jwt:
  # Local-development-only fallback. The "prod" profile (application-prod.properties)
  # overrides this with no default, so deploys fail fast if JWT_SECRET is unset.
  secret: ${JWT_SECRET:dev-secret-key-change-in-production-use-at-least-256-bits}

logging:
  level:
    com.annapolislabs.lineage: DEBUG
    org.springframework.web: INFO
    org.springframework.security: DEBUG
